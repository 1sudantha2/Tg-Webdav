name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & test (linux/amd64, static)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Resolve dependencies
        run: go mod tidy

      - name: Sync go.mod/go.sum back to the branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- go.mod go.sum; then
            git add go.mod go.sum
            git commit -m "chore: sync go.mod/go.sum"
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Cross-compile static binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" \
            -o dist/tg-webdav-linux-amd64 ./cmd/server
          chmod +x dist/tg-webdav-linux-amd64

      - name: Smoke test (HTTP layer, auth, WebDAV PROPFIND, Web UI)
        working-directory: dist
        run: |
          fail() {
            echo "::error::smoke test failed ($1); server.log: $(tail -c 1500 server.log 2>/dev/null | tr '\n' '|')"
            exit 1
          }
          printf '%s\n' \
            'PORT=18080' \
            'TELEGRAM_API_ID=999999' \
            'TELEGRAM_API_HASH=00000000000000000000000000000000' \
            'TELEGRAM_BOT_TOKEN=99999999:AAfakefakefakefakefakefakefakefake' \
            'TELEGRAM_CHANNEL_ID=-1001234567890' \
            'WEBDAV_USER=admin' \
            'WEBDAV_PASSWORD=test123' > .env
          ./tg-webdav-linux-amd64 > server.log 2>&1 &
          SERVER_PID=$!
          sleep 1
          kill -0 $SERVER_PID 2>/dev/null || fail "server exited immediately"
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:18080/web/ && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:18080/web/ | grep -q 'Tg-WebDAV' || fail "web ui"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/dav/)" = 401 || fail "dav auth"
          curl -sf -X PROPFIND -u admin:test123 -H 'Depth: 1' \
            http://127.0.0.1:18080/dav/ | grep -q general || fail "propfind"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X MKCOL -u admin:test123 \
            http://127.0.0.1:18080/dav/movies)" = 201 || fail "mkcol"
          curl -sf -c cj -X POST -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"test123"}' \
            http://127.0.0.1:18080/web/api/login > /dev/null || fail "login"
          curl -sf -b cj 'http://127.0.0.1:18080/web/api/ls?path=/' | grep -q movies || fail "ls"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"wrong"}' \
            http://127.0.0.1:18080/web/api/login)" = 401 || fail "bad login"
          kill $SERVER_PID 2>/dev/null || true
          echo "smoke test OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-webdav-linux-amd64
          path: dist/tg-webdav-linux-amd64
          if-no-files-found: error

  release:
    name: Attach binary to release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-webdav-linux-amd64

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            tg-webdav-linux-amd64 --repo "${{ github.repository }}"
