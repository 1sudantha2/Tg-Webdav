name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & test (linux/amd64, static)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Resolve dependencies
        run: go mod tidy

      - name: Sync go.mod/go.sum back to the branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- go.mod go.sum; then
            git add go.mod go.sum
            git commit -m "chore: sync go.mod/go.sum"
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Cross-compile static binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" \
            -o dist/tg-webdav-linux-amd64 ./cmd/server
          chmod +x dist/tg-webdav-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-webdav-linux-amd64
          path: dist/tg-webdav-linux-amd64
          if-no-files-found: error

  release:
    name: Attach binary to release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: tg-webdav-linux-amd64

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            tg-webdav-linux-amd64 --repo "${{ github.repository }}"
